<!DOCTYPE html>
<html>
<head>
  <title>GR4DP Chat UI</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chat-box { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: auto; margin-bottom: 10px; padding: 10px; }
    #user-input { width: 80%; padding: 5px; }
    #send-btn { padding: 5px 10px; }
    .user { color: blue; }
    .system { color: green; }
  </style>
</head>
<body>
  <h1>GR4DP Chat</h1>
  <div id="chat-box"></div>
  <form id="chat-form" onsubmit="return false;">
    <input id="user-input" type="text" placeholder="Type your message..." required />
    <button id="send-btn" type="submit">Send</button>
  </form>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const chatForm = document.getElementById('chat-form');

    chatForm.addEventListener('submit', async () => {
      const message = userInput.value.trim();
      if (!message) return;

      addMessageToChat('You', message, 'user');
      userInput.value = '';

      try {
        const formData = new FormData();
        formData.append('message', message);

        const response = await fetch('/chat', {
          method: 'POST',
          body: formData
        });
        const json = await response.json();
        addMessageToChat('System', json.response, 'system');
      } catch (e) {
        addMessageToChat('Error', e.toString(), 'system');
      }
    });

    function addMessageToChat(sender, text, cssClass) {
      const p = document.createElement('p');
      p.className = cssClass;
      p.textContent = sender + ': ' + text;
      chatBox.appendChild(p);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
